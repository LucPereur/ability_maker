[project]
name = "ability-maker"
version = "0.1.0"
description = "Ability composition system"
requires-python = ">=3.12"
dependencies = [
    "dotenv",
    "langchain",
    "langchain-google-genai",
    "pandas",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = []
